[project]
name = "chinook-customer-support-agent"
version = "0.1.0"
description = "Multi-agent AI customer support system for digital music store using Chinook database."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Manish Kansara", email = "kansaramanish912@gmail.com" }
]
license = { text = "MIT" }

# Project Core Dependencies
dependencies = [
    "gradio>=4.0.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

# Optional / Developer Dependencies (installed via `pip install -e .[dev]`)
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]

# ==============================================================================
# 3. TOOL CONFIGURATIONS
# Centralized settings for testing and code quality tools.
# ==============================================================================

# Pytest Configuration (Matches the required test suite setup)
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Code Formatter (Black) Configuration
[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

# Linter (Ruff) Configuration
[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I"] # Style errors, syntax errors, and import sorting